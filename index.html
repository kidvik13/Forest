<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forest — Focus Timer</title>
<style>
  :root {
    --bg: #f5efe4;
    --bg-soft: #ebe3d3;
    --ink: #3b4a3a;
    --ink-soft: #6b7a68;
    --leaf: #4f8a5a;
    --leaf-deep: #2f5d3a;
    --leaf-soft: #8fc098;
    --bark: #6b4a2b;
    --accent: #d99066;
    --danger: #b54e3c;
    --ring-bg: #e3dac4;
    --shadow: 0 4px 20px rgba(60, 50, 30, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    padding: 32px 20px 80px;
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--leaf-deep);
  }

  .streak {
    background: white;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--ink-soft);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .streak strong { color: var(--leaf-deep); font-weight: 600; }

  .modes {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--bg-soft);
    padding: 6px;
    border-radius: 999px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  .mode-btn {
    border: none;
    background: transparent;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
  }
  .mode-btn.active {
    background: white;
    color: var(--leaf-deep);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .mode-btn:hover:not(.active) { color: var(--ink); }

  .timer-stage {
    position: relative;
    width: 360px;
    height: 360px;
    margin: 0 auto 8px;
  }

  .progress-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 360px;
    height: 360px;
    transform: rotate(-90deg);
    cursor: grab;
    touch-action: none;
  }
  .progress-ring.running { cursor: default; }
  .progress-ring.dragging { cursor: grabbing; }
  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 14;
  }
  .ring-fg {
    fill: none;
    stroke: var(--leaf);
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear, stroke 0.4s;
  }
  .ring-fg.failed { stroke: var(--danger); }
  .ring-fg.break { stroke: var(--accent); }

  .ring-thumb {
    fill: white;
    stroke: var(--leaf);
    stroke-width: 4;
    transition: opacity 0.2s, fill 0.2s, stroke 0.2s;
    pointer-events: none;
  }
  .ring-thumb.hidden { opacity: 0; }
  .ring-thumb.break { stroke: var(--accent); }

  .ring-content {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 70px;
  }

  .time-display {
    font-size: 56px;
    font-weight: 300;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    line-height: 1;
  }
  .time-sublabel {
    margin-top: 4px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tree-wrap {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 180px;
    pointer-events: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .tree-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .tree-svg .grow {
    transform-origin: 100px 180px;
    transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.6s;
  }
  .tree-svg.wilted .leaves,
  .tree-svg.wilted .canopy {
    fill: #9a7050 !important;
    stroke: #9a7050 !important;
    opacity: 0.7;
  }
  .tree-svg.wilted .trunk {
    fill: #5a3a20 !important;
    stroke: #5a3a20 !important;
  }
  .tree-svg.wilted .grow {
    transform: rotate(8deg) translateY(8px) !important;
    transition: all 0.8s ease-in;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  .tree-svg.complete .grow {
    animation: sway 4s ease-in-out infinite;
    transform-origin: 100px 180px;
  }

  .tree-picker {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 24px auto 0;
    flex-wrap: wrap;
    max-width: 520px;
  }
  .tree-option {
    background: white;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.15s;
    width: 70px;
    height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .tree-option:hover { transform: translateY(-2px); }
  .tree-option.active {
    border-color: var(--leaf);
    background: #f0f6ee;
  }
  .tree-option svg { width: 44px; height: 44px; }
  .tree-option .name {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .tree-option.active .name { color: var(--leaf-deep); }
  .tree-option:disabled { opacity: 0.5; cursor: not-allowed; }
  .tree-option:disabled:hover { transform: none; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary { background: var(--leaf-deep); color: white; }
  .btn-primary:hover { background: var(--leaf); }
  .btn-secondary {
    background: white;
    color: var(--ink-soft);
    border: 1px solid var(--bg-soft);
  }
  .btn-secondary:hover { color: var(--ink); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid #e8c5be;
  }
  .btn-danger:hover { background: #faeee9; }

  .sound-toggle {
    display: flex;
    justify-content: center;
    margin-top: 16px;
    gap: 8px;
    align-items: center;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .sound-toggle button {
    background: white;
    border: 1px solid var(--bg-soft);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: inherit;
  }
  .sound-toggle button.on { color: var(--leaf-deep); border-color: var(--leaf-soft); }

  .status-msg {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    min-height: 20px;
    margin-top: 12px;
    transition: opacity 0.3s;
  }

  .forest-section {
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--bg-soft);
  }
  .forest-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .forest-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--leaf-deep);
  }
  .forest-header .count { font-size: 13px; color: var(--ink-soft); }

  .forest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 12px;
    background: var(--bg-soft);
    padding: 18px;
    border-radius: 16px;
    min-height: 100px;
  }
  .forest-tree {
    aspect-ratio: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: transform 0.2s;
    cursor: default;
  }
  .forest-tree:hover { transform: translateY(-2px); }
  .forest-tree svg { width: 100%; height: 100%; }
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🌱 Forest</h1>
  <div class="streak">
    <span>Today's streak</span>
    <strong id="streak-count">0</strong>
  </div>
</header>

<div class="modes">
  <button class="mode-btn active" data-mode="focus">Focus</button>
  <button class="mode-btn" data-mode="short">Short break</button>
  <button class="mode-btn" data-mode="long">Long break</button>
</div>

<div class="timer-stage">
  <svg class="progress-ring" id="ring" viewBox="0 0 360 360">
    <circle class="ring-bg" cx="180" cy="180" r="160" />
    <circle class="ring-fg" id="ring-fg" cx="180" cy="180" r="160" />
    <circle class="ring-thumb" id="ring-thumb" r="13" cx="340" cy="180" />
  </svg>

  <div class="ring-content">
    <div class="time-display" id="time-display">25:00</div>
    <div class="time-sublabel" id="time-sublabel">drag to set</div>
  </div>

  <div class="tree-wrap">
    <svg class="tree-svg" id="tree" viewBox="0 0 200 200" preserveAspectRatio="xMidYMax meet"></svg>
  </div>
</div>

<div class="tree-picker" id="tree-picker"></div>

<div class="controls">
  <button class="btn btn-primary" id="start-btn">Plant</button>
  <button class="btn btn-danger" id="give-up-btn" style="display: none;">Give up</button>
  <button class="btn btn-secondary" id="reset-btn" style="display: none;">Reset</button>
</div>

<div class="sound-toggle">
  <span>Ambient sound</span>
  <button id="sound-btn">Off</button>
</div>

<div class="status-msg" id="status-msg"></div>

<section class="forest-section">
  <div class="forest-header">
    <h2>Your forest</h2>
    <span class="count" id="forest-count">0 trees</span>
  </div>
  <div class="forest-grid" id="forest-grid"></div>
</section>

<script>
(() => {
  // ---- Tree types ------------------------------------------------------
  // Each tree type defines the colors used and a renderer for each of the
  // four growth stages plus a mini icon for the forest grid.
  // SVGs use viewBox 0 0 200 200; ground line at y=180; tree trunk at x≈100.
  // Class names .trunk, .canopy, .leaves are required so the wilt CSS works.

  function seedling(c) {
    return `
      <path class="trunk" d="M99 180 L99 168 L101 168 L101 180Z" fill="${c.leaf}"/>
      <ellipse class="leaves" cx="96" cy="166" rx="5" ry="3" fill="${c.leaf}" transform="rotate(-25 96 166)"/>
      <ellipse class="leaves" cx="104" cy="166" rx="5" ry="3" fill="${c.leaf}" transform="rotate(25 104 166)"/>
    `;
  }

  function sprout(c) {
    return `
      <rect class="trunk" x="98" y="148" width="4" height="34" fill="${c.trunk}"/>
      <ellipse class="leaves" cx="89" cy="146" rx="9" ry="5" fill="${c.leaf}" transform="rotate(-30 89 146)"/>
      <ellipse class="leaves" cx="111" cy="146" rx="9" ry="5" fill="${c.leaf}" transform="rotate(30 111 146)"/>
      <ellipse class="leaves" cx="100" cy="138" rx="7" ry="6" fill="${c.leafLight}"/>
    `;
  }

  // Round-canopy small tree (used for oak/cherry/maple)
  function smallRound(c) {
    return `
      <rect class="trunk" x="96" y="128" width="8" height="54" fill="${c.trunk}" rx="2"/>
      <circle class="canopy" cx="100" cy="118" r="24" fill="${c.leaf}"/>
      <circle class="canopy" cx="84" cy="126" r="14" fill="${c.leafDark}"/>
      <circle class="canopy" cx="116" cy="126" r="14" fill="${c.leafDark}"/>
      <circle class="canopy" cx="100" cy="106" r="12" fill="${c.leafLight}"/>
    `;
  }

  function fullRound(c) {
    return `
      <rect class="trunk" x="93" y="108" width="14" height="74" fill="${c.trunk}" rx="3"/>
      <path class="trunk" d="M93 138 Q88 130 82 128" stroke="${c.trunk}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path class="trunk" d="M107 136 Q113 128 119 126" stroke="${c.trunk}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle class="canopy" cx="100" cy="98" r="40" fill="${c.leafDark}"/>
      <circle class="canopy" cx="74" cy="108" r="22" fill="${c.leaf}"/>
      <circle class="canopy" cx="126" cy="108" r="22" fill="${c.leaf}"/>
      <circle class="canopy" cx="100" cy="74" r="22" fill="${c.leaf}"/>
      <circle class="canopy" cx="84" cy="90" r="16" fill="${c.leafLight}"/>
      <circle class="canopy" cx="116" cy="90" r="16" fill="${c.leafLight}"/>
      <circle class="canopy" cx="100" cy="104" r="14" fill="${c.leafLight}"/>
    `;
  }

  function miniRound(c) {
    return `<svg viewBox="0 0 60 60">
      <ellipse cx="30" cy="55" rx="13" ry="2" fill="#000" opacity="0.08"/>
      <rect class="trunk" x="28" y="38" width="4" height="18" fill="${c.trunk}" rx="1"/>
      <circle class="canopy" cx="30" cy="28" r="14" fill="${c.leafDark}"/>
      <circle class="canopy" cx="22" cy="32" r="9" fill="${c.leaf}"/>
      <circle class="canopy" cx="38" cy="32" r="9" fill="${c.leaf}"/>
      <circle class="canopy" cx="30" cy="20" r="8" fill="${c.leaf}"/>
      <circle class="canopy" cx="26" cy="26" r="5" fill="${c.leafLight}"/>
    </svg>`;
  }

  // Pine — triangular evergreen, stacked layers
  function smallPine(c) {
    return `
      <rect class="trunk" x="98" y="142" width="4" height="40" fill="${c.trunk}"/>
      <polygon class="canopy" points="100,86 78,128 122,128" fill="${c.leafDark}"/>
      <polygon class="canopy" points="100,108 76,144 124,144" fill="${c.leaf}"/>
    `;
  }

  function fullPine(c) {
    return `
      <rect class="trunk" x="96" y="160" width="8" height="22" fill="${c.trunk}" rx="1"/>
      <polygon class="canopy" points="100,42 78,82 122,82" fill="${c.leafDark}"/>
      <polygon class="canopy" points="100,72 70,118 130,118" fill="${c.leaf}"/>
      <polygon class="canopy" points="100,108 60,162 140,162" fill="${c.leafDark}"/>
      <polygon class="canopy" points="100,90 82,118 118,118" fill="${c.leafLight}" opacity="0.6"/>
    `;
  }

  function miniPine(c) {
    return `<svg viewBox="0 0 60 60">
      <ellipse cx="30" cy="55" rx="11" ry="2" fill="#000" opacity="0.08"/>
      <rect class="trunk" x="28" y="48" width="4" height="8" fill="${c.trunk}"/>
      <polygon class="canopy" points="30,12 18,28 42,28" fill="${c.leafDark}"/>
      <polygon class="canopy" points="30,22 14,40 46,40" fill="${c.leaf}"/>
      <polygon class="canopy" points="30,32 12,50 48,50" fill="${c.leafDark}"/>
    </svg>`;
  }

  // Bonsai — twisted trunk in a pot, small layered canopy
  function sproutBonsai(c) {
    return `
      <rect x="80" y="172" width="40" height="10" fill="${c.pot || '#9c6a48'}" rx="2"/>
      <rect x="78" y="168" width="44" height="6" fill="${c.potRim || '#7a5238'}" rx="1"/>
      <path class="trunk" d="M100 168 Q96 160 100 152" stroke="${c.trunk}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse class="leaves" cx="100" cy="148" rx="10" ry="5" fill="${c.leaf}"/>
    `;
  }

  function smallBonsai(c) {
    return `
      <rect x="76" y="172" width="48" height="10" fill="${c.pot || '#9c6a48'}" rx="2"/>
      <rect x="74" y="168" width="52" height="6" fill="${c.potRim || '#7a5238'}" rx="1"/>
      <path class="trunk" d="M100 168 Q92 158 102 146 Q108 138 96 130" stroke="${c.trunk}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse class="canopy" cx="92" cy="128" rx="16" ry="8" fill="${c.leafDark}"/>
      <ellipse class="canopy" cx="106" cy="132" rx="14" ry="7" fill="${c.leaf}"/>
      <ellipse class="canopy" cx="98" cy="124" rx="10" ry="5" fill="${c.leafLight}"/>
    `;
  }

  function fullBonsai(c) {
    return `
      <rect x="70" y="172" width="60" height="10" fill="${c.pot || '#9c6a48'}" rx="2"/>
      <rect x="68" y="168" width="64" height="6" fill="${c.potRim || '#7a5238'}" rx="1"/>
      <path class="trunk" d="M100 168 Q88 156 104 142 Q116 130 90 118 Q80 110 100 100" stroke="${c.trunk}" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse class="canopy" cx="76" cy="118" rx="20" ry="10" fill="${c.leafDark}"/>
      <ellipse class="canopy" cx="124" cy="128" rx="18" ry="9" fill="${c.leafDark}"/>
      <ellipse class="canopy" cx="100" cy="98" rx="22" ry="11" fill="${c.leaf}"/>
      <ellipse class="canopy" cx="84" cy="112" rx="14" ry="6" fill="${c.leafLight}"/>
      <ellipse class="canopy" cx="118" cy="122" rx="14" ry="6" fill="${c.leafLight}"/>
      <ellipse class="canopy" cx="102" cy="92" rx="12" ry="5" fill="${c.leafLight}"/>
    `;
  }

  function miniBonsai(c) {
    return `<svg viewBox="0 0 60 60">
      <rect x="20" y="50" width="20" height="6" fill="${c.pot || '#9c6a48'}" rx="1"/>
      <path class="trunk" d="M30 50 Q24 40 32 32 Q38 26 28 20" stroke="${c.trunk}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse class="canopy" cx="22" cy="22" rx="9" ry="5" fill="${c.leafDark}"/>
      <ellipse class="canopy" cx="38" cy="28" rx="8" ry="4" fill="${c.leaf}"/>
      <ellipse class="canopy" cx="30" cy="16" rx="7" ry="4" fill="${c.leafLight}"/>
    </svg>`;
  }

  // Willow — drooping branches
  function fullWillow(c) {
    const strands = [
      'M70 110 Q66 130 62 150',
      'M82 118 Q80 140 76 162',
      'M100 122 Q100 146 100 168',
      'M118 118 Q120 140 124 162',
      'M130 110 Q134 130 138 150',
      'M90 116 Q86 134 84 156',
      'M110 116 Q114 134 116 156',
    ].map(d => `<path class="leaves" d="${d}" stroke="${c.leafDark}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`).join('');
    return `
      <rect class="trunk" x="95" y="120" width="10" height="62" fill="${c.trunk}" rx="2"/>
      <ellipse class="canopy" cx="100" cy="100" rx="42" ry="22" fill="${c.leaf}"/>
      <ellipse class="canopy" cx="100" cy="92" rx="32" ry="14" fill="${c.leafLight}"/>
      ${strands}
    `;
  }

  function miniWillow(c) {
    return `<svg viewBox="0 0 60 60">
      <ellipse cx="30" cy="55" rx="13" ry="2" fill="#000" opacity="0.08"/>
      <rect class="trunk" x="28" y="36" width="4" height="20" fill="${c.trunk}" rx="1"/>
      <ellipse class="canopy" cx="30" cy="28" r="13" rx="16" ry="8" fill="${c.leaf}"/>
      <path class="leaves" d="M18 32 Q16 42 14 50" stroke="${c.leafDark}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path class="leaves" d="M30 36 Q30 46 30 54" stroke="${c.leafDark}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path class="leaves" d="M42 32 Q44 42 46 50" stroke="${c.leafDark}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  const TREE_TYPES = {
    oak: {
      name: 'Oak',
      colors: { trunk: '#6b4a2b', leafDark: '#2f5d3a', leaf: '#4f8a5a', leafLight: '#8fc098' },
      stages: [seedling, sprout, smallRound, fullRound],
      mini: miniRound,
    },
    pine: {
      name: 'Pine',
      colors: { trunk: '#5a3d20', leafDark: '#1f4a2c', leaf: '#357045', leafLight: '#5a9268' },
      stages: [seedling, sprout, smallPine, fullPine],
      mini: miniPine,
    },
    cherry: {
      name: 'Cherry',
      colors: { trunk: '#7a5238', leafDark: '#d77ba0', leaf: '#f1a8c0', leafLight: '#fad0e0' },
      stages: [seedling, sprout, smallRound, fullRound],
      mini: miniRound,
    },
    maple: {
      name: 'Maple',
      colors: { trunk: '#7a4a28', leafDark: '#a83825', leaf: '#d96138', leafLight: '#e8a060' },
      stages: [seedling, sprout, smallRound, fullRound],
      mini: miniRound,
    },
    bonsai: {
      name: 'Bonsai',
      colors: {
        trunk: '#6b4523', leafDark: '#2a5535', leaf: '#4a8055', leafLight: '#7ab089',
        pot: '#a06b48', potRim: '#7a5238',
      },
      stages: [seedling, sproutBonsai, smallBonsai, fullBonsai],
      mini: miniBonsai,
    },
    willow: {
      name: 'Willow',
      colors: { trunk: '#7a6a4a', leafDark: '#5a8a3a', leaf: '#9ac060', leafLight: '#c8d890' },
      stages: [seedling, sprout, smallRound, fullWillow],
      mini: miniWillow,
    },
  };

  const TREE_ORDER = ['oak', 'pine', 'cherry', 'maple', 'bonsai', 'willow'];

  // ---- State -----------------------------------------------------------
  const MIN_DURATION = 1;
  const MAX_DURATION = 120; // minutes; full ring = MAX
  const MODE_DEFAULTS = { focus: 25, short: 5, long: 15 };

  const state = {
    mode: 'focus',
    duration: 25,
    remaining: 25 * 60,
    running: false,
    failed: false,
    completed: false,
    intervalId: null,
    treeType: 'oak',
  };

  const $ = (id) => document.getElementById(id);
  const treeEl = $('tree');
  const ring = $('ring');
  const ringFg = $('ring-fg');
  const ringThumb = $('ring-thumb');
  const timeDisplay = $('time-display');
  const timeSublabel = $('time-sublabel');
  const startBtn = $('start-btn');
  const giveUpBtn = $('give-up-btn');
  const resetBtn = $('reset-btn');
  const statusMsg = $('status-msg');
  const streakEl = $('streak-count');
  const forestGrid = $('forest-grid');
  const forestCount = $('forest-count');
  const soundBtn = $('sound-btn');
  const treePicker = $('tree-picker');

  const RING_R = 160;
  const RING_C = 2 * Math.PI * RING_R;
  ringFg.setAttribute('stroke-dasharray', RING_C);

  // ---- Persistence -----------------------------------------------------
  const STORAGE_KEY = 'forest_app_v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { trees: [], streak: 0, lastDate: null, selectedType: 'oak' };
      const parsed = JSON.parse(raw);
      return {
        trees: parsed.trees || [],
        streak: parsed.streak || 0,
        lastDate: parsed.lastDate || null,
        selectedType: parsed.selectedType || 'oak',
      };
    } catch (e) {
      return { trees: [], streak: 0, lastDate: null, selectedType: 'oak' };
    }
  }

  function saveState(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function todaysStreak(s) {
    return s.lastDate === todayStr() ? s.streak : 0;
  }

  // ---- Tree rendering --------------------------------------------------
  function renderTreeForStage(stageIdx) {
    const t = TREE_TYPES[state.treeType] || TREE_TYPES.oak;
    const stageFn = t.stages[stageIdx] || t.stages[0];
    treeEl.innerHTML = `
      <ellipse cx="100" cy="184" rx="42" ry="4" fill="#000" opacity="0.06"/>
      <g class="grow">${stageFn(t.colors)}</g>
    `;
  }

  function getStageForProgress(progress) {
    if (progress >= 0.99) return 3;
    if (progress >= 0.66) return 2;
    if (progress >= 0.33) return 1;
    return 0;
  }

  let currentStage = -1;
  function updateTreeStage(progress) {
    if (state.failed) return;
    const idx = getStageForProgress(progress);
    if (idx !== currentStage) {
      currentStage = idx;
      renderTreeForStage(idx);
    }
  }

  function resetTree() {
    treeEl.classList.remove('wilted', 'complete');
    currentStage = -1;
    renderTreeForStage(0);
  }

  // ---- Timer rendering -------------------------------------------------
  function fmtTime(secs) {
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = (secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderTimer() {
    timeDisplay.textContent = fmtTime(state.remaining);
    // Arc fraction = remaining / MAX_DURATION (consistent: arc shows time left)
    const f = Math.min(1, state.remaining / (MAX_DURATION * 60));
    ringFg.setAttribute('stroke-dashoffset', RING_C * (1 - f));
    updateThumb(f);
    // Tree progress = (duration - remaining) / duration
    const total = state.duration * 60;
    const progress = total > 0 ? (total - state.remaining) / total : 0;
    updateTreeStage(progress);
  }

  function updateThumb(fraction) {
    // SVG-local position; SVG element is rotated -90° so this maps visually.
    const angle = fraction * 2 * Math.PI;
    const x = 180 + RING_R * Math.cos(angle);
    const y = 180 + RING_R * Math.sin(angle);
    ringThumb.setAttribute('cx', x);
    ringThumb.setAttribute('cy', y);
    if (state.running || fraction === 0) ringThumb.classList.add('hidden');
    else ringThumb.classList.remove('hidden');
  }

  function renderSublabel() {
    if (state.running) {
      timeSublabel.textContent = state.mode === 'focus' ? 'stay focused' : 'on a break';
    } else if (state.failed) {
      timeSublabel.textContent = 'tree withered';
    } else if (state.completed) {
      timeSublabel.textContent = 'planted';
    } else {
      timeSublabel.textContent = 'drag to set';
    }
  }

  // ---- Drag-on-ring interaction ---------------------------------------
  let dragging = false;

  function fractionFromPointer(clientX, clientY) {
    const rect = ring.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    if (dx === 0 && dy === 0) return 0;
    let angle = Math.atan2(dx, -dy); // clockwise from top
    if (angle < 0) angle += 2 * Math.PI;
    return angle / (2 * Math.PI);
  }

  function setDurationFromFraction(f) {
    let mins = Math.round(f * MAX_DURATION);
    if (mins < MIN_DURATION) mins = MIN_DURATION;
    if (mins > MAX_DURATION) mins = MAX_DURATION;
    state.duration = mins;
    state.remaining = mins * 60;
    renderTimer();
  }

  function onPointerDown(e) {
    if (state.running) return;
    if (state.failed || state.completed) reset();
    dragging = true;
    ring.classList.add('dragging');
    ring.setPointerCapture && e.pointerId !== undefined && ring.setPointerCapture(e.pointerId);
    setDurationFromFraction(fractionFromPointer(e.clientX, e.clientY));
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragging) return;
    setDurationFromFraction(fractionFromPointer(e.clientX, e.clientY));
    e.preventDefault();
  }

  function onPointerUp() {
    dragging = false;
    ring.classList.remove('dragging');
  }

  ring.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  // ---- Modes -----------------------------------------------------------
  document.querySelectorAll('.mode-btn').forEach((btn) => {
    btn.onclick = () => {
      if (state.running) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      state.duration = MODE_DEFAULTS[state.mode];
      state.remaining = state.duration * 60;
      const isBreak = state.mode !== 'focus';
      ringFg.classList.toggle('break', isBreak);
      ringThumb.classList.toggle('break', isBreak);
      state.failed = false;
      state.completed = false;
      resetTree();
      renderTimer();
      renderSublabel();
    };
  });

  // ---- Tree picker -----------------------------------------------------
  function renderTreePicker() {
    treePicker.innerHTML = '';
    TREE_ORDER.forEach((typeKey) => {
      const t = TREE_TYPES[typeKey];
      const btn = document.createElement('button');
      btn.className = 'tree-option' + (typeKey === state.treeType ? ' active' : '');
      btn.disabled = state.running;
      btn.innerHTML = `${t.mini(t.colors)}<span class="name">${t.name}</span>`;
      btn.onclick = () => {
        if (state.running) return;
        state.treeType = typeKey;
        const s = loadState();
        s.selectedType = typeKey;
        saveState(s);
        renderTreePicker();
        if (currentStage >= 0) renderTreeForStage(currentStage);
      };
      treePicker.appendChild(btn);
    });
  }

  // ---- Forest grid -----------------------------------------------------
  function renderForest() {
    const s = loadState();
    const all = s.trees;
    forestCount.textContent = `${all.length} tree${all.length === 1 ? '' : 's'}`;
    forestGrid.innerHTML = '';
    if (all.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'Complete a focus session to plant your first tree';
      forestGrid.appendChild(empty);
      return;
    }
    all.forEach((tree) => {
      const type = tree.type && TREE_TYPES[tree.type] ? tree.type : 'oak';
      const t = TREE_TYPES[type];
      const el = document.createElement('div');
      el.className = 'forest-tree';
      el.title = `${t.name} · ${tree.duration} min · ${new Date(tree.timestamp).toLocaleString()}`;
      el.innerHTML = t.mini(t.colors);
      forestGrid.appendChild(el);
    });
  }

  function renderStreak() {
    streakEl.textContent = todaysStreak(loadState());
  }

  // ---- Audio (Web Audio noise) -----------------------------------------
  let audioCtx = null;
  let noiseNode = null;
  let gainNode = null;
  let soundOn = false;

  function startSound() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + 0.02 * white) / 1.02;
      data[i] = lastOut * 3.5;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1000;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.08;
    noiseNode.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    noiseNode.start();
  }

  function stopSound() {
    if (noiseNode) { try { noiseNode.stop(); } catch (e) {} noiseNode.disconnect(); noiseNode = null; }
    if (gainNode) { gainNode.disconnect(); gainNode = null; }
  }

  soundBtn.onclick = () => {
    soundOn = !soundOn;
    if (soundOn) { startSound(); soundBtn.textContent = 'On'; soundBtn.classList.add('on'); }
    else { stopSound(); soundBtn.textContent = 'Off'; soundBtn.classList.remove('on'); }
  };

  // ---- Timer control ---------------------------------------------------
  function start() {
    if (state.running) return;
    state.running = true;
    state.failed = false;
    state.completed = false;
    treeEl.classList.remove('wilted', 'complete');
    ring.classList.add('running');
    startBtn.style.display = 'none';
    giveUpBtn.style.display = state.mode === 'focus' ? 'inline-block' : 'none';
    resetBtn.style.display = state.mode !== 'focus' ? 'inline-block' : 'none';
    statusMsg.textContent = state.mode === 'focus'
      ? 'Stay focused — your tree is growing'
      : 'Take a break';
    renderTreePicker();
    renderSublabel();
    renderTimer();

    state.intervalId = setInterval(() => {
      state.remaining -= 1;
      renderTimer();
      if (state.remaining <= 0) complete();
    }, 1000);
  }

  function complete() {
    clearInterval(state.intervalId);
    state.running = false;
    state.completed = true;
    state.remaining = 0;
    ring.classList.remove('running');
    renderTimer();
    renderTreeForStage(3);
    treeEl.classList.add('complete');
    startBtn.style.display = 'inline-block';
    startBtn.textContent = 'Plant another';
    giveUpBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
    renderTreePicker();
    renderSublabel();

    if (state.mode === 'focus') {
      const s = loadState();
      const today = todayStr();
      if (s.lastDate === today) s.streak += 1;
      else { s.streak = 1; s.lastDate = today; }
      s.trees.push({
        duration: state.duration,
        timestamp: Date.now(),
        type: state.treeType,
      });
      saveState(s);
      statusMsg.textContent = `🌳 Tree planted! Streak: ${s.streak}`;
      renderStreak();
      renderForest();
    } else {
      statusMsg.textContent = 'Break complete';
    }
  }

  function giveUp() {
    if (!state.running) return;
    if (!confirm('Give up? Your tree will wither.')) return;
    clearInterval(state.intervalId);
    state.running = false;
    state.failed = true;
    ring.classList.remove('running');
    treeEl.classList.add('wilted');
    startBtn.style.display = 'inline-block';
    startBtn.textContent = 'Try again';
    giveUpBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
    statusMsg.textContent = '💔 Your tree withered. Try again?';
    const s = loadState();
    if (s.lastDate === todayStr()) {
      s.streak = 0;
      saveState(s);
      renderStreak();
    }
    renderTreePicker();
    renderSublabel();
  }

  function reset() {
    clearInterval(state.intervalId);
    state.running = false;
    state.failed = false;
    state.completed = false;
    state.remaining = state.duration * 60;
    ring.classList.remove('running');
    resetTree();
    renderTimer();
    startBtn.style.display = 'inline-block';
    startBtn.textContent = state.mode === 'focus' ? 'Plant' : 'Start';
    giveUpBtn.style.display = 'none';
    resetBtn.style.display = 'none';
    statusMsg.textContent = '';
    renderTreePicker();
    renderSublabel();
  }

  startBtn.onclick = start;
  giveUpBtn.onclick = giveUp;
  resetBtn.onclick = reset;

  // ---- Init ------------------------------------------------------------
  const saved = loadState();
  if (saved.selectedType && TREE_TYPES[saved.selectedType]) {
    state.treeType = saved.selectedType;
  }
  resetTree();
  renderTimer();
  renderTreePicker();
  renderForest();
  renderStreak();
  renderSublabel();
})();
</script>

</body>
</html>
